https://www.gstatic.com/charts/loader.jsscript>

<script type="text/javascript">

google.charts.load('current', {'packages':['corechart']});
google.charts.setOnLoadCallback(drawCharts);

function drawCharts() {

var data = google.visualization.arrayToDataTable([
['Version','Count'],

['21H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "21H2") of it) ?>],

['22H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "22H2") of it) ?>],

['23H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "23H2") of it) ?>],

['24H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "24H2") of it) ?>],

['25H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "25H2") of it) ?>],

['26H2', <?relevance number of bes computers whose (exists result (bes property "Windows 11 Version") whose (value of it = "26H2") of it) ?>]
]);

var piechart =
new google.visualization.PieChart(
document.getElementById('piechart'));

piechart.draw(data,
{
title:'Windows 11 Version Distribution',
width:700,
height:400
});

var barchart =
new google.visualization.ColumnChart(
document.getElementById('barchart'));

barchart.draw(data,
{
title:'Windows 11 Version Counts',
width:700,
height:400,
legend:{position:'none'}
});

}
</script>
